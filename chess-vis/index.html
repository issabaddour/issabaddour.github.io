<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chess Control Visualizer – single file</title>

<!-- 1.  chessboard.js CSS  (includes piece sprites via data-URIs) -->
<link rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

<style>
/* extra UI styling */
body{font-family:Arial,Helvetica,sans-serif;text-align:center;margin-top:20px}
h1{margin-bottom:18px}
.buttons{margin-top:14px}
button{margin:0 6px 8px;padding:6px 12px;font-size:14px;cursor:pointer}
/* square-colour overlays */
.square-blue   {background:rgba( 66,133,244,0.65)!important}
.square-red    {background:rgba(219, 68, 55,0.65)!important}
.square-purple {background:rgba(123, 31,162,0.70)!important}
</style>
</head>

<body>
<h1>Chess Control Visualizer</h1>

<div id="board" style="width:480px;margin:0 auto;"></div>

<div class="buttons">
  <button id="flipBtn">Flip Board</button>
  <button id="showBtn">Show Control</button>
  <button id="clearBtn" disabled>Clear Colours</button>
  <button id="resetBtn">Reset Position</button>
</div>

<!-- 2. dependencies: jQuery, chess.js, chessboard.js -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.4.0/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
/* ===== INITIALISE ===== */
const game  = new Chess();
const board = Chessboard('board', {
  position: 'start',
  draggable: true,
  dropOffBoard: 'snapback',
  onDrop: handleMove
});

/* prevent illegal moves + clear colours after every move */
function handleMove (source, target) {
  const move = game.move({from: source, to: target, promotion: 'q'});
  if (!move) return 'snapback';
  clearColours();
}

/* ===== BUTTONS ===== */
$('#flipBtn').click(() => board.flip());

$('#resetBtn').click(() => {
  game.reset(); board.position('start'); clearColours();
});

$('#showBtn').click(() => { colourControl(); toggleButtons(true); });
$('#clearBtn').click(() => { clearColours(); toggleButtons(false); });

function toggleButtons(coloursVisible){
  $('#showBtn').prop('disabled', coloursVisible);
  $('#clearBtn').prop('disabled', !coloursVisible);
}

/* ===== CONTROL-MAP LOGIC ===== */
function colourControl(){
  const whiteCtrl=new Set(), blackCtrl=new Set();

  game.SQUARES.forEach(sq=>{
    game.moves({square:sq,verbose:true})
        .forEach(m=> (m.color==='w'?whiteCtrl:blackCtrl).add(m.to));
  });

  /* apply CSS classes */
  $('#board .square-55d63').each(function(){
    const sq=this.dataset.square;
    $(this).removeClass('square-blue square-red square-purple');
    const w=whiteCtrl.has(sq), b=blackCtrl.has(sq);
    if (w&&b) $(this).addClass('square-purple');
    else if (w) $(this).addClass('square-blue');
    else if (b) $(this).addClass('square-red');
  });
}

function clearColours(){
  $('#board .square-55d63')
      .removeClass('square-blue square-red square-purple');
}
</script>
</body>
</html>
