<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Chess Control Visualizer</title>
  <link rel="stylesheet" href="chessboard-1.0.0.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Chess Control Visualizer</h1>

  <div id="board" style="width: 480px;"></div>

  <div class="buttons">
    <button id="flipBtn">Flip Board</button>
    <button id="showCtrlBtn">Show Control</button>
    <button id="clearCtrlBtn" disabled>Clear Colours</button>
    <button id="resetBtn">Reset Position</button>
  </div>

  <script src="chess.js"></script>
  <script src="chessboard-1.0.0.js"></script>
  <script src="app.js"></script>
</body>
</html>
