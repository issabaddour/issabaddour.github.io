<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Coordinate Trainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Chess Coordinate Trainer</h1>
            <p>Master the chessboard coordinates with interactive training</p>
        </header>

        <div class="game-controls">
            <div class="mode-selection">
                <button id="learning-mode" class="btn btn--primary mode-btn active">
                    Learning Mode
                </button>
                <button id="testing-mode" class="btn btn--outline mode-btn">
                    Testing Mode
                </button>
            </div>
            
            <div class="game-actions">
                <button id="start-btn" class="btn btn--primary">Start Game</button>
                <button id="stop-btn" class="btn btn--secondary hidden">Stop Game</button>
                <button id="next-btn" class="btn btn--outline hidden">Next</button>
                <button id="reset-stats" class="btn btn--outline">Reset Stats</button>
            </div>
        </div>

        <div class="game-content">
            <div class="left-panel">
                <div class="coordinate-display">
                    <h2 id="coordinate-text">Click Start to begin</h2>
                    <div id="timer" class="timer hidden">0.0s</div>
                </div>

                <div class="statistics">
                    <h3>Statistics</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-label">Accuracy</span>
                            <span id="accuracy" class="stat-value">0%</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Total Questions</span>
                            <span id="total-questions" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Current Streak</span>
                            <span id="current-streak" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Best Streak</span>
                            <span id="best-streak" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Average Time</span>
                            <span id="average-time" class="stat-value">0.0s</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Best Time</span>
                            <span id="best-time" class="stat-value">-</span>
                        </div>
                    </div>
                </div>

                <div class="settings">
                    <h3>Settings</h3>
                    <div class="form-group">
                        <label class="form-label" for="difficulty">Difficulty Level</label>
                        <select id="difficulty" class="form-control">
                            <option value="full">Full Board</option>
                            <option value="center">Center Squares</option>
                            <option value="edges">Edges Only</option>
                            <option value="corners">Corners Only</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="chessboard-container">
                <div class="chessboard">
                    <div class="rank-labels">
                        <div class="rank-label">8</div>
                        <div class="rank-label">7</div>
                        <div class="rank-label">6</div>
                        <div class="rank-label">5</div>
                        <div class="rank-label">4</div>
                        <div class="rank-label">3</div>
                        <div class="rank-label">2</div>
                        <div class="rank-label">1</div>
                    </div>
                    <div class="board-grid">
                        <!-- Chess squares will be generated by JavaScript -->
                    </div>
                    <div class="file-labels">
                        <div class="file-label">a</div>
                        <div class="file-label">b</div>
                        <div class="file-label">c</div>
                        <div class="file-label">d</div>
                        <div class="file-label">e</div>
                        <div class="file-label">f</div>
                        <div class="file-label">g</div>
                        <div class="file-label">h</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="feedback" id="feedback" role="alert"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
